version: '3.9'
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: deps
    command: sh -c "corepack enable && pnpm dev"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL}
